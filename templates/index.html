<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f9fc">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{URL}}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{URL}}">
  <meta property="og:image" content="{{URL}}assets/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{TITLE}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{URL}}assets/share.png">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
  <script type="application/ld+json">{{SCHEMA}}</script>
</head>
<body id="top">
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <nav class="container" aria-label="主导航">{{NAV}}</nav>
  </header>
  <main id="main" class="container" tabindex="-1">
    <section id="about" class="about" aria-labelledby="profile-name">
      <header class="profile-header">
        <h1 id="profile-name">{{NAME}}</h1>
        <p class="identity">{{IDENTITY}}</p>
      </header>
      <div class="intro-body{{PHOTO_CLASS}}">
        <div class="biography">{{ABOUT}}{{CONTACT_INLINE}}</div>
        {{PROFILE}}
      </div>
    </section>
    {{INTERESTS_SECTION}}
    {{UPDATES_SECTION}}
    {{WRITING_SECTION}}
    {{PROJECTS_SECTION}}
  </main>
  <footer class="site-footer">
    <div class="container"><p>© {{YEAR}} {{NAME}} · 更新于 <time datetime="{{UPDATED}}">{{UPDATED}}</time></p><a href="#top">回到顶部</a></div>
  </footer>
</body>
</html>
